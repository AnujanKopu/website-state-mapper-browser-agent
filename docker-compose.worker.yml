services:
  crawl-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    init: true
    read_only: true
    stdin_open: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp:deploy/seccomp_profile.json
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    shm_size: 1g
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
      - /home/pwuser:rw,noexec,nosuid,size=128m
    volumes:
      - ${FLOWSTATE_JOB_DIR:?set FLOWSTATE_JOB_DIR}:/job:rw
    ulimits:
      nofile: 4096
      fsize: 1048576
    networks:
      - crawl-egress
    stop_grace_period: 10s

networks:
  crawl-egress:
    driver: bridge
