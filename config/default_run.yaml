# Default run configuration. Values here are validated against
# engine.schemas.RunConfig -- unknown keys are rejected.

browser:
  headless: true
  viewport:
    width: 1366
    height: 900
  # null -> use Playwright's default user agent for the bundled Chromium.
  user_agent: null
  navigation_timeout_ms: 20000
  # How long the page must stay quiet (after load) before we snapshot it.
  stabilize_quiet_ms: 500

capture:
  full_page_screenshot: true
  max_interactables: 100
  # Visible text beyond this length is truncated before hashing/storage.
  max_visible_text_chars: 20000

# Exploration budgets; whichever exhausts first stops the run.
budgets:
  max_states: 60
  max_actions: 150
  max_depth: 4
  max_wall_seconds: 300

exploration:
  # Out-edges enqueued per state (top-K after ranking); keeps the graph clean.
  max_actions_per_state: 12
  action_timeout_ms: 5000
