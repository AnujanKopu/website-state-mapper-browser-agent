# Default run configuration. Values here are validated against
# engine.schemas.RunConfig -- unknown keys are rejected.

browser:
  headless: true
  viewport:
    width: 1366
    height: 900
  # null -> use Playwright's default user agent for the bundled Chromium.
  user_agent: null
  navigation_timeout_ms: 20000
  # How long the page must stay quiet (after load) before we snapshot it.
  stabilize_quiet_ms: 500

capture:
  full_page_screenshot: true
  max_interactables: 100
  # Visible text beyond this length is truncated before hashing/storage.
  max_visible_text_chars: 20000
  # Persist raw DOM HTML snapshots. Disable for UI-driven runs that only
  # consume screenshots + graph JSON.
  save_dom_snapshots: true
  # Viewport-grounded discovery scrolls the page in ~90%-viewport steps so
  # below-the-fold affordances are found (0 = current viewport only).
  max_scroll_steps: 4

# Exploration budgets; whichever exhausts first stops the run.
budgets:
  max_states: 60
  max_actions: 150
  max_depth: 4
  max_wall_seconds: 300

exploration:
  # Out-edges enqueued per state (top-K after ranking); keeps the graph clean.
  max_actions_per_state: 12
  action_timeout_ms: 5000
  # Distinct states kept per loose URL family (e.g. /post/#); further siblings
  # fold into the family representative as skipped items + inferred edges.
  url_family_cap: 3
  # Header/menu actions allowed while looking for a hidden login entry.
  auth_discovery_action_cap: 6
  # Same-URL tabs/menus are bounded separately from page navigation depth.
  max_substate_depth: 2

authentication:
  # API/UI requests may override this per run. Credentials are never stored here.
  mode: guest
