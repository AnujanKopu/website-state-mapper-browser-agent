[project]
name = "flowstate-engine"
version = "0.1.0"
description = "FlowState: a browser agent that reverse-engineers web apps into interactive state graphs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.49",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "pillow>=10.4",
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.49.0",
    "sse-starlette>=3.4.4",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    # Benign Windows ProactorEventLoop cleanup noise when a cancelled run's
    # Playwright subprocess transport is GC'd during test teardown.
    "ignore:unclosed transport:ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
