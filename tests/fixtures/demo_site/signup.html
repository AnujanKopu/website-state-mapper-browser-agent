<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sign up</title></head>
<body>
  <h1>Create your account</h1>
  <form action="/register" method="post">
    <label>Email <input type="email" autocomplete="username" required></label>
    <label>Password <input type="password" autocomplete="new-password" required></label>
    <button type="submit">Create account</button>
  </form>
  <a href="login.html">Log in</a>
  <a href="recovery.html">Forgot password?</a>
</body>
</html>
