<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Checkout - FlowState Demo</title>
  <style>body { font-family: sans-serif; margin: 2rem; }</style>
</head>
<body>
  <h1>Checkout - Pro plan</h1>
  <p>You are purchasing the Pro plan for $29/month.</p>
  <form id="payment-form">
    <label>Name on card <input name="cardholder" /></label>
    <label>Card number <input name="cardnumber" placeholder="Card number" /></label>
    <label>CVC <input name="cvc" placeholder="CVC" /></label>
    <button id="pay-button" type="submit">Pay $29 now</button>
  </form>
  <button id="place-order">Place order</button>
</body>
</html>
